[build-system]
requires = ["setuptools>=45"]
build-backend = "setuptools.build_meta"

[project]
name = "aios-os"
version = "0.3.0"
# CLAIM HYGIENE (2026-08-03): the previous description advertised "your agents
# carry forward what worked" — the exact claim our own pre-registered experiments
# FALSIFIED (three transports, C_overall = 0.000; see
# docs/AIOS_THREE_CHANNEL_NULL_REPORT_2026-08-01.md). Shipping it would sell a
# disproven claim. What we actually earned is below; keep it that way.
# Unrelated to arXiv:2403.16971 "AIOS: LLM Agent Operating System".
description = "AIOS — a sovereign sidecar for AI agents: your work survives the agent. Tamper-evident work ledger, freshness-gated resume after a context death, orphan reclaim onto any live substrate, and externally-verified handoff, all local-first and sandbox-enforced"
readme = "README.md"
requires-python = ">=3.10"
authors = [{name = "Jaewon Choi", email = "cjw070690@gmail.com"}]
license = { text = "Apache-2.0" }
keywords = ["ai", "agent", "llm", "local-first", "personal-ai", "aios", "autonomous-agent"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: OS Independent",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Environment :: Console",
]
# No required PyPI deps — AIOS uses stdlib + optional providers.
# Install extras below for the provider you want.
dependencies = []

[project.urls]
Homepage = "https://github.com/cjw0076/myworld"
Repository = "https://github.com/cjw0076/myworld"
"Bug Tracker" = "https://github.com/cjw0076/myworld/issues"
Documentation = "https://github.com/cjw0076/myworld/blob/main/README.md"

[project.optional-dependencies]
gemini    = ["google-generativeai"]
ollama    = []          # Ollama is a local binary — install via aios setup apply
scrapling = ["scrapling[fetchers]"]   # backs the web.scrape tool (stealth fetch); scrapling install still needed for browser deps

[project.scripts]
aios = "aios_launcher:main"
# Documented PyPI/uvx alternative to the Claude Code plugin:
#   uvx --from aios-os aios-mcp
# The plugin itself does NOT depend on this entry point — it runs the bundled
# scripts/aios_mcp_server.py directly via ${CLAUDE_PLUGIN_ROOT} and bare python3.
aios-mcp = "aios_mcp_server:main"

[tool.setuptools]
# The functional AIOS core is a set of flat, stdlib-only modules under scripts/.
# With package-dir mapping "" -> scripts, every name below lands FLAT in
# site-packages (adjacent to aios_launcher.py), so a plain `pip install .` wheel
# is self-contained: the launcher resolves its dispatch targets adjacent to
# itself (see script_path() in aios_launcher.py) with no repo clone required.
# Editable install (-e) still keeps the launcher at its original path so
# launcher_relative_root() resolves to the myworld/ root.
package-dir = {"" = "scripts"}
py-modules  = [
    "aios_launcher",
    "aios_runtime",
    "aios_harness",
    "aios_memory",
    "aios_routing",
    "aios_adapters",
    "aios_local_memory",
    "aios_capture_args",
    "aios_ask",
    "aios_invoke",
    "aios_few_shot_injector",
    "aios_pattern_extractor",
    "aios_founder_capture",
    "aios_work_praxis",
    "aios_chat",
    "aios_chat_router",
    "aios_onboard",
    "aios_cli_style",
    "aios_demo",
    "aios_capability_base",
    "aios_substrate_router",
    "aios_deadline_copilot",
    "aios_serving_api",
    "aios_setup",
    "aios_shell",
    "aios_head",
    "aios_akashic",
    "aios_capability_scanner",
    "aios_helper",
    "aios_device_profile",
    "aios_install",
    "aios_completion",
    "aios_local_app",
    "aios_agent_behavior",
    "aios_agent_self",
    "aios_acp_drive",
    "aios_mcp_server",
    # --- 2026-08-03 packaging repair -------------------------------------
    # Found by walking the import graph of the modules listed above: these were
    # imported by shipped code but never packaged, so `pip install aios-os`
    # produced a wheel whose core paths raise ImportError. Notably it shipped
    # WITHOUT aios_egress_gate and aios_authority — i.e. the package made a
    # sovereignty claim it could not enforce. Re-run the check before every
    # release: walk imports from py-modules and assert nothing is missing.
    "aios_authority",
    "aios_egress_gate",
    "aios_freshness",
    "aios_turn_loop",
    "aios_tools",
    "aios_agent_registry",
    "aios_akashic_guard",
    "aios_llm_client",
    "aios_self_audit",
    "aios_skills_loader",
    "aios_stakes",
    "aios_trace_interior",
    "aios_work_history",
    # --- society layer (G1-G3 + D2, 2026-08) -----------------------------
    # Ships as mechanism only. The society's VALUE claim is unproven until the
    # frozen G5 experiment runs (docs/AIOS_G5_SOCIETY_PREREG_2026-08-03.md);
    # product copy must not claim it beats a single agent with a ledger.
    "aios_society",
    "aios_takeover_verify",
    "aios_society_watchdog",
    "aios_sandbox",
    "aios_skills",
    "aios_experience",
    # --- ideation absorption (2026-08-10) --------------------------------
    # Harvests ideas from public sources and admits them to a ledger ONLY if a
    # deterministic oracle can find the quoted span verbatim in the source.
    # Ships as mechanism: a `novel` row means "not already in our docs", never
    # "true" — epistemic_type stays Proposal until a run receipt raises it.
    "aios_ideation",
    "aios_claimcheck",
    "aios_conform",
]
# aios_primitives is a stdlib-only PACKAGE (not a flat module): aios_runtime does
# `from aios_primitives import events`, so it must ship as a package, not via
# py-modules. Its flat sibling shim scripts/aios_primitives.py is only for
# explicit `python scripts/aios_primitives.py` invocation (never used by the
# launcher) and is intentionally not shipped.
packages = ["aios_primitives"]

[tool.pytest.ini_options]
# tests/hivemind_tasks/ are self-contained research-probe FIXTURES (the GIMPS
# composition-gap tasks) with their own producer/consumer modules + path setup;
# they are not product tests and break a top-level `pytest tests/` collection.
# Exclude them so the documented `pytest tests/` is green from a clean clone;
# run the probe explicitly via its own harness when needed.
addopts = "--ignore=tests/hivemind_tasks"
