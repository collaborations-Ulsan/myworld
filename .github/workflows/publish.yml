name: publish

# Trigger: push a semver tag (e.g. v0.1.0)
#   git tag -a v0.1.0 -m "v0.1.0" && git push origin v0.1.0
#
# OIDC Trusted Publisher setup (no API token needed).
#
# aios-os does not exist on PyPI yet, so the project-level "Publishing" tab
# does not apply — that page only exists once a project does. Use the PENDING
# publisher flow, which pre-authorises the very first upload and creates the
# project on it:
#
#   pypi.org → account → Publishing → "Add a new pending publisher"
#     PyPI Project Name: aios-os
#     Owner:             cjw0076
#     Repository:        myworld
#     Workflow name:     publish.yml
#     Environment:       pypi
#
# After the first successful release it converts to a normal trusted publisher.
# The `pypi` GitHub environment this job targets already exists.
on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch: {}

permissions:
  contents: read
  id-token: write   # required for OIDC trusted publisher

jobs:
  build:
    name: build distribution
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build
        run: pip install build && python -m build
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish-pypi:
    name: publish to PyPI
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
